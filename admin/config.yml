# Decap CMS – Eralux
# Вхід через GitHub. OAuth – functions/api/auth.js і callback.js (Cloudflare Pages).
# Після переносу домену змінити base_url на https://eralux.com.ua
backend:
  name: github
  repo: eraluxsteli/eralux
  branch: main
  base_url: https://eralux-zv8.pages.dev
  auth_endpoint: api/auth

locale: uk
logo_url: /images/brand/logo.svg
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: "site"
    label: "Сайт"
    files:
      - name: "header"
        label: "1. Шапка"
        file: "content/header.json"
        fields:
          - label: "Меню"
            name: "nav"
            widget: "list"
            summary: "{{fields.label}} → {{fields.href}}"
            fields:
              - { label: "Назва", name: "label", widget: "string" }
              - { label: "Посилання (#якір або сторінка.html)", name: "href", widget: "string", pattern: ['^(#[a-z0-9-]+|[a-z0-9-]+\.html(#[a-z0-9-]+)?)$', "Напр. #projects або dealers.html"] }
          - { label: "Телефон (як показувати)", name: "phone_label", widget: "string" }
          - { label: "Телефон (для дзвінка, +380...)", name: "phone_tel", widget: "string", pattern: ['^\+380\d{9}$', "Формат: +380XXXXXXXXX"] }
          - { label: "Графік роботи", name: "schedule", widget: "string" }
          - { label: "Текст кнопки", name: "cta", widget: "string" }

      - name: "hero"
        label: "2. Перший екран"
        file: "content/hero.json"
        fields:
          - { label: "Надхедер (з блискавкою)", name: "power", widget: "string" }
          - { label: "Мітка зліва", name: "label", widget: "string" }
          - { label: "Мітка справа", name: "label_right", widget: "string" }
          - { label: "Заголовок – рядок 1", name: "title_1", widget: "string", hint: "Залиште «Натяжні стелі» – це важливо для Google" }
          - { label: "Заголовок – рядок 2", name: "title_2", widget: "string" }
          - { label: "Заголовок – рядок 3 (зелений)", name: "title_3", widget: "string" }
          - { label: "Текст під заголовком", name: "text", widget: "text" }
          - { label: "Кнопка 1", name: "cta_primary", widget: "string" }
          - { label: "Кнопка 2", name: "cta_secondary", widget: "string" }
          - { label: "Рейтинг Google (напр. 5,0)", name: "rating_value", widget: "string" }
          - { label: "Кількість відгуків (напр. 100+)", name: "rating_count", widget: "string" }
          - { label: "Посилання на профіль Google", name: "rating_url", widget: "string", pattern: ['^https://(maps\.app\.goo\.gl/|(www\.)?google\.|g\.page/)', "Посилання з Google Карт"] }
          - { label: "Факт 2 – значення (ціна)", name: "tag1", widget: "string" }
          - { label: "Факт 2 – підпис", name: "tag1_note", widget: "string" }
          - { label: "Факт 3 – значення", name: "tag2", widget: "string" }
          - { label: "Факт 3 – підпис", name: "tag2_note", widget: "string" }
          - label: "Фото (3 шт.)"
            name: "photos"
            widget: "list"
            min: 3
            max: 3
            summary: "{{fields.tag}} – {{fields.caption}}"
            fields:
              - { label: "Фото", name: "image", widget: "image", hint: "Перше – горизонтальне від 1760 px; інші – від 900 px. WebP або JPG до 400 КБ." }
              - { label: "Опис фото (alt)", name: "alt", widget: "string" }
              - { label: "Мітка", name: "tag", widget: "string" }
              - { label: "Підпис", name: "caption", widget: "string" }
              - { label: "Куди веде (#якір)", name: "link", widget: "string", pattern: ['^(#[a-z0-9-]+|[a-z0-9-]+\.html(#[a-z0-9-]+)?)$', "Напр. #ceilings"] }

      - name: "stats"
        label: "3. Про нас і цифри"
        file: "content/stats.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Фраза – початок (сірий)", name: "lead_1", widget: "string" }
          - { label: "Фраза – головне (жирний)", name: "lead_2", widget: "string" }
          - { label: "Фраза – кінець (сірий)", name: "lead_3", widget: "string" }
          - { label: "Комірка 1 – число", name: "n1", widget: "string", pattern: ['^\d{1,6}$', "Лише цифри"] }
          - { label: "Комірка 1 – одиниця", name: "u1", widget: "string" }
          - { label: "Комірка 1 – опис", name: "d1", widget: "string" }
          - { label: "Комірка 2 – число", name: "n2", widget: "string", pattern: ['^\d{1,6}$', "Лише цифри"] }
          - { label: "Комірка 2 – одиниця", name: "u2", widget: "string" }
          - { label: "Комірка 2 – опис", name: "d2", widget: "string" }
          - { label: "Комірка 3 – число", name: "n3", widget: "string", pattern: ['^\d{1,6}$', "Лише цифри"] }
          - { label: "Комірка 3 – одиниця", name: "u3", widget: "string" }
          - { label: "Комірка 3 – опис", name: "d3", widget: "string" }
          - { label: "Темна комірка – заголовок", name: "own_title", widget: "string" }
          - { label: "Темна комірка – текст", name: "own_text", widget: "text" }
          - { label: "Темна комірка – посилання", name: "own_link", widget: "string" }
          - { label: "Фото", name: "photo", widget: "image", hint: "Від 900 px, WebP або JPG до 300 КБ" }
          - { label: "Опис фото (alt)", name: "photo_alt", widget: "string" }
          - { label: "Мітка на фото", name: "photo_tag", widget: "string" }

      - name: "light"
        label: "4. Світло (день / вечір)"
        file: "content/light.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – слово 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – слово 2 (жирне)", name: "title_2", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Список – заголовок", name: "list_title", widget: "string" }
          - { label: "Підсумок – підпис", name: "total_label", widget: "string" }
          - { label: "Примітка під підсумком", name: "note", widget: "text" }
          - { label: "Кнопка", name: "button", widget: "string" }
          - { label: "«Також робимо» – заголовок", name: "also_title", widget: "string" }
          - label: "«Також робимо» – рішення"
            name: "also"
            widget: "select"
            multiple: true
            options:
              - { label: "Світлові лінії", value: "lines" }
              - { label: "Вбудований трек", value: "track_built" }
              - { label: "Трек з шиною", value: "track_bus" }
              - { label: "LED-підсвітка", value: "led" }
              - { label: "Точкові світильники", value: "spot" }
              - { label: "Люстра чи підвіс", value: "chandelier" }
          - label: "Кімнати (до 4)"
            name: "rooms"
            widget: "list"
            max: 4
            summary: "{{fields.name}} · {{fields.area}}"
            fields:
              - { label: "Назва", name: "name", widget: "string" }
              - { label: "Площа (напр. 38 м²)", name: "area", widget: "string" }
              - { label: "Фото вдень", name: "day", widget: "image", hint: "Горизонтальне 3:2, від 1600 px. Той самий ракурс, що й вечірнє." }
              - { label: "Фото ввечері", name: "night", widget: "image", hint: "Той самий ракурс і розмір, що й денне." }
              - { label: "Опис денного фото (alt)", name: "alt_day", widget: "string" }
              - { label: "Опис вечірнього фото (alt)", name: "alt_night", widget: "string" }
              - label: "Що світиться"
                name: "items"
                widget: "list"
                summary: "{{fields.id}} × {{fields.qty}}"
                fields:
                  - label: "Рішення"
                    name: "id"
                    widget: "select"
                    options:
                      - { label: "Точкові світильники (шт)", value: "spot" }
                      - { label: "Люстра чи підвіс (шт)", value: "chandelier" }
                      - { label: "LED-підсвітка (м.п.)", value: "led" }
                      - { label: "Світлові лінії (м.п.)", value: "lines" }
                      - { label: "Вбудований трек (м.п.)", value: "track_built" }
                      - { label: "Трек з шиною (м.п.)", value: "track_bus" }
                  - { label: "Власна назва (необовʼязково)", name: "label", widget: "string", required: false }
                  - { label: "Кількість", name: "qty", widget: "number", value_type: "int", min: 1 }

      - name: "prices"
        label: "Ціни (для світла, полотен і калькулятора)"
        file: "content/prices.json"
        fields:
          - { label: "Полотно, грн/м² (база)", name: "canvas_m2", widget: "number", value_type: "int", min: 0 }
          - { label: "Профіль по периметру + вставка, грн/м.п.", name: "perimeter_m", widget: "number", value_type: "int", min: 0 }
          - { label: "Кутів у ціні", name: "corners_included", widget: "number", value_type: "int", min: 0 }
          - { label: "Додатковий кут, грн", name: "extra_corner", widget: "number", value_type: "int", min: 0 }
          - { label: "Кут на парящому / єврокрабі, грн", name: "extra_corner_premium", widget: "number", value_type: "int", min: 0 }
          - label: "Полотна"
            name: "canvases"
            widget: "list"
            summary: "{{fields.name}} – {{fields.price}} грн/м²"
            fields:
              - { label: "ID (не змінювати)", name: "id", widget: "string" }
              - { label: "Назва", name: "name", widget: "string" }
              - { label: "Ціна, грн/м²", name: "price", widget: "number", value_type: "int", min: 0 }
          - label: "Профілі (доплата)"
            name: "profiles"
            widget: "list"
            summary: "{{fields.name}} – +{{fields.price}} грн/м.п."
            fields:
              - { label: "ID (не змінювати)", name: "id", widget: "string" }
              - { label: "Назва", name: "name", widget: "string" }
              - { label: "Доплата, грн/м.п.", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Кути за ціною парящого", name: "premium_corners", widget: "boolean", required: false }
          - label: "Світло"
            name: "light"
            widget: "list"
            summary: "{{fields.name}} – {{fields.price}} грн/{{fields.unit}}"
            fields:
              - { label: "ID (не змінювати)", name: "id", widget: "string" }
              - { label: "Назва", name: "name", widget: "string" }
              - { label: "Одиниця", name: "unit", widget: "select", options: ["шт", "м.п."] }
              - { label: "Ціна, грн", name: "price", widget: "number", value_type: "int", min: 0 }
          - { label: "Висота 3–3,5 м, +%", name: "height_3", widget: "number", value_type: "int", min: 0 }
          - { label: "Висота понад 3,5 м, +%", name: "height_35", widget: "number", value_type: "int", min: 0 }
          - { label: "Доїзд, грн/км", name: "fuel_km", widget: "number", value_type: "int", min: 0 }

      - name: "ceilings"
        label: "5. Полотно і профіль"
        file: "content/ceilings.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – частина 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – частина 2 (зелена)", name: "title_2", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Підзаголовок «Полотно»", name: "canvas_title", widget: "string" }
          - { label: "Підзаголовок «Профіль»", name: "profile_title", widget: "string" }
          - label: "Полотна (назви й ціни – у розділі «Ціни»)"
            name: "canvases"
            widget: "list"
            max: 6
            summary: "{{fields.id}}"
            fields:
              - label: "Полотно"
                name: "id"
                widget: "select"
                options:
                  - { label: "Матове", value: "matte" }
                  - { label: "Сатин", value: "satin" }
                  - { label: "Глянець", value: "gloss" }
                  - { label: "Тканинне", value: "fabric" }
              - { label: "Опис", name: "text", widget: "text" }
              - { label: "Фото", name: "image", widget: "image", hint: "Від 1000 px, WebP або JPG до 300 КБ" }
              - { label: "Опис фото (alt)", name: "alt", widget: "string" }
          - label: "Профілі – описи (назви й ціни – у розділі «Ціни»)"
            name: "profiles"
            widget: "list"
            summary: "{{fields.id}}"
            fields:
              - label: "Профіль"
                name: "id"
                widget: "select"
                options:
                  - { label: "ПВХ зі вставкою", value: "pvc" }
                  - { label: "Тіньовий", value: "shadow" }
                  - { label: "Тіньовий Max", value: "shadow_max" }
                  - { label: "Парящий", value: "floating" }
                  - { label: "Брус", value: "beam" }
                  - { label: "Сепаратор", value: "separator" }
              - { label: "Опис", name: "text", widget: "text" }
              - { label: "Фото (макро стику стелі й стіни)", name: "image", widget: "image", required: false, hint: "4:3, від 800 px, до 250 КБ" }
              - { label: "Опис фото (alt)", name: "alt", widget: "string", required: false }
          - { label: "Смуга виробництва – мітка", name: "factory_label", widget: "string" }
          - { label: "Смуга виробництва – заголовок", name: "factory_title", widget: "string" }
          - { label: "Смуга виробництва – текст", name: "factory_text", widget: "text" }
          - { label: "Смуга виробництва – кнопка", name: "factory_link", widget: "string" }
          - { label: "Підказка внизу", name: "hint", widget: "text" }
          - { label: "Підказка – кнопка", name: "hint_button", widget: "string" }

      - name: "before_after"
        label: "6. До / після"
        file: "content/before_after.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – частина 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – частина 2 (зелена)", name: "title_2", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Кнопка", name: "button", widget: "string" }
          - label: "Пари фото (до 6)"
            name: "pairs"
            widget: "list"
            max: 6
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Мітки (2–4)", name: "chips", widget: "list", field: { label: "Мітка", name: "chip", widget: "string" } }
              - { label: "Опис", name: "text", widget: "text" }
              - { label: "Фото ДО", name: "before", widget: "image", hint: "4:3, від 1200 px. Найкраще – з того самого місця, що й ПІСЛЯ." }
              - { label: "Фото ПІСЛЯ", name: "after", widget: "image", hint: "4:3, того ж розміру, що й ДО." }
              - { label: "Опис фото ДО (alt)", name: "alt_before", widget: "string" }
              - { label: "Опис фото ПІСЛЯ (alt)", name: "alt_after", widget: "string" }

      - name: "projects"
        label: "7. Проєкти"
        file: "content/projects.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – частина 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – частина 2 (світла)", name: "title_2", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - label: "Обʼєкти"
            name: "items"
            widget: "list"
            max: 8
            summary: "{{fields.title}} · {{fields.district}} · {{fields.area}}"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Район / місто", name: "district", widget: "string" }
              - { label: "Площа (напр. 52 м²)", name: "area", widget: "string" }
              - { label: "Полотно", name: "canvas", widget: "string" }
              - { label: "Профіль", name: "profile", widget: "string" }
              - { label: "Світло", name: "light", widget: "string" }
              - { label: "Фото (2–5, перше – головне)", name: "photos", widget: "list", min: 1, max: 5, field: { label: "Фото", name: "photo", widget: "image" }, hint: "3:2, від 1400 px, WebP або JPG до 400 КБ" }
              - { label: "Опис головного фото (alt)", name: "alt", widget: "string" }
              - label: "Розкладка ціни (сума рахується сама)"
                name: "breakdown"
                widget: "list"
                summary: "{{fields.label}} – {{fields.value}} грн"
                fields:
                  - { label: "Що", name: "label", widget: "string" }
                  - { label: "Сума, грн (0 = «у ціні»)", name: "value", widget: "number", value_type: "int", min: 0 }

      - name: "calc"
        label: "8. Калькулятор (тексти; ціни – у розділі «Ціни»)"
        file: "content/calc.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – частина 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – частина 2 (зелена)", name: "title_2", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - { label: "Крок 1", name: "step1", widget: "string" }
          - { label: "Крок 2", name: "step2", widget: "string" }
          - { label: "Крок 3", name: "step3", widget: "string" }
          - { label: "Крок 4", name: "step4", widget: "string" }
          - { label: "Крок 5", name: "step5", widget: "string" }
          - { label: "Примітка під світлом", name: "light_note", widget: "text" }
          - { label: "Результат – підпис", name: "result_title", widget: "string" }
          - { label: "Форма – заголовок", name: "form_title", widget: "string" }
          - { label: "Кнопка", name: "button", widget: "string" }
          - { label: "Після відправки – заголовок", name: "ok_title", widget: "string" }
          - { label: "Після відправки – текст", name: "ok_text", widget: "text" }
          - { label: "Площа за замовчуванням, м²", name: "default_area", widget: "number", value_type: "int", min: 5, max: 120 }

      - name: "process"
        label: "9. Як ми працюємо"
        file: "content/process.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – частина 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – частина 2 (зелена)", name: "title_2", widget: "string" }
          - { label: "Текст", name: "text", widget: "text" }
          - label: "Кроки (4)"
            name: "steps"
            widget: "list"
            min: 4
            max: 4
            summary: "{{fields.title}}"
            fields:
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Текст", name: "text", widget: "text" }
              - { label: "Акцент (зелений рядок)", name: "accent", widget: "string", required: false }
          - { label: "Монтаж – заголовок", name: "mount_title", widget: "string" }
          - { label: "Монтаж – етапи", name: "mount", widget: "list", field: { label: "Етап", name: "step", widget: "string" } }
          - { label: "Примітка 1", name: "note_1", widget: "string" }
          - { label: "Примітка 2", name: "note_2", widget: "string" }
          - { label: "Гарантія – початок", name: "guarantee", widget: "string" }
          - { label: "Гарантія – виділене", name: "guarantee_b", widget: "string" }
          - { label: "Фото", name: "photo", widget: "image", hint: "4:3, від 1000 px" }
          - { label: "Опис фото (alt)", name: "photo_alt", widget: "string" }
          - { label: "Мітка на фото", name: "photo_tag", widget: "string" }

      - name: "reviews"
        label: "10. Відгуки"
        file: "content/reviews.json"
        fields:
          - { label: "Мітка", name: "label", widget: "string" }
          - { label: "Заголовок – частина 1", name: "title_1", widget: "string" }
          - { label: "Заголовок – частина 2 (зелена)", name: "title_2", widget: "string" }
          - { label: "Рейтинг (напр. 5,0)", name: "rating", widget: "string" }
          - { label: "Кількість відгуків (напр. 100+)", name: "count", widget: "string" }
          - { label: "Підпис кількості", name: "count_label", widget: "string" }
          - { label: "Текст посилання", name: "link_label", widget: "string" }
          - { label: "Посилання на Google", name: "link", widget: "string", pattern: ['^https://(maps\.app\.goo\.gl/|(www\.)?google\.|g\.page/)', "Посилання з Google Карт"] }
          - label: "Відгуки (лише справжні, з Google чи Facebook)"
